resources:
  jobs:
    prepare_exmedbert_plos_snapshot:
      name: prepare-exmedbert-plos-snapshot
      description: Build a leakage-safe admission-time PLOS snapshot with serverless Spark.
      tasks:
        - task_key: prepare_plos_snapshot
          spark_python_task:
            python_file: ../spark/prepare_plos_snapshot.py
            parameters:
              - --source-root
              - ${var.downstream_source_root}
              - --pretrain-snapshot-root
              - ${var.pretrain_snapshot_root}
              - --output-root
              - ${var.downstream_snapshot_output_root}
              - --snapshot-version
              - ${var.plos_snapshot_version}
              - --observation-end-date
              - ${var.observation_end_date}
              - --plos-threshold-days
              - ${var.plos_threshold_days}
              - --num-shards
              - ${var.downstream_num_shards}
              - --train-label-fraction
              - ${var.downstream_train_fraction}
              - --subset-seed
              - ${var.downstream_subset_seed}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
